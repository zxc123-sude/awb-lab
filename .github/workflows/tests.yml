name: Python checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m awb_lab demo --output-dir demo-output
      - run: python -m awb_lab evaluate demo-output/manifest.csv --output-dir outputs
  learned-awb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m awb_lab.learning demo --output-dir ai-smoke
      - run: python -m awb_lab.learning train ai-smoke/train.csv ai-smoke/val.csv --output-dir ai-model --epochs 1 --input-size 32 --allow-synthetic
      - run: python -m awb_lab.learning evaluate ai-model/best.pt ai-smoke/test.csv --output-dir ai-test --allow-synthetic
